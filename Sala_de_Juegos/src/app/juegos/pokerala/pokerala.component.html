<div class="container juego-pokerala">

  <!-- Botón Comenzar -->
    <div *ngIf="!juegoIniciado" class="comenzar-container">
        <button (click)="iniciarJuego()" class="btn btn-primary">Comenzar</button>
    </div>

  <!-- Vista principal del juego -->
    <div *ngIf="juegoIniciado" class="zona-juego">
        <div class="mano-container" *ngFor="let mano of manos; let i = index">
            <ng-container *ngIf="i <= manoActual">
                <div class="horizonte">
                <!-- Carta descartada -->
                <div class="carta">
                    <img
                    *ngIf="mano.cartasDescartadas.length > 0"
                    [src]="mano.cartasDescartadas[mano.cartasDescartadas.length - 1].imagen"
                    alt="Descartada" />
                </div>

                <!-- Carta del mazo (Back) -->
                <div class="carta">
                    <img src="assets/cartas/Back.png" alt="Mazo" />
                </div>

                <!-- Cartas en mano -->
                    <div *ngFor="let carta of mano.manoJugador" class="carta">
                        <img
                        [src]="carta.imagen"
                        alt="{{ carta.nombre }}"
                        [class.seleccionada]="mano.cartasSeleccionadas.includes(carta)"
                        [style.pointerEvents]="i === manoActual ? 'auto' : 'none'"
                        (click)="i === manoActual && toggleCartaSeleccionada(carta, i)" />
                    </div>
                </div>

                <!-- Cronómetro solo para la mano actual -->
                <app-cronometro *ngIf="i === manoActual" #cronometro></app-cronometro>

                <!-- Resultado -->
                <div *ngIf="mano.juegoTerminado" class="resultado">
                    <p><strong>{{ mano.juego }}</strong></p>
                    <p>Puntaje: {{ mano.puntaje }}</p>
                </div>

                <!-- Botón para cambiar cartas solo si es la mano actual -->
                <div
                    *ngIf="i === manoActual && !mano.juegoTerminado && mano.cambiosDisponibles > 0"
                    class="cambiar-cartas-container">
                    <button (click)="cambiarCartas(i)" class="btn btn-warning btn-lg">
                        Cambiar cartas ({{ mano.cambiosDisponibles }} restante{{ mano.cambiosDisponibles > 1 ? 's' : '' }})
                    </button>
                </div>
            </ng-container>
        </div>

    </div>
</div>
