<div class="card-wrapper">
    <div class="auth-container">
      <h2>Iniciar Sesión</h2>
  
      <form [formGroup]="form" (submit)="onSubmit()">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="Correo electrónico" formControlName="email" name="email" required />
        
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Contraseña" formControlName="password" name="password" required />
  
        <button class="login-btn" type="submit">Ingresar</button>
        
        <h2>Login rápido</h2>
        <div class="quick-login">
          <button type="button" (click)="loginRapido('test@example.com', 'test123')">TEST</button>
          <button type="button" (click)="loginRapido('admin@example.com', 'adm123')">ADM</button>
          <button type="button" (click)="loginRapido('desarr@example.com', 'des123')">DEV</button>
        </div>
  
        <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
      </form>
    </div>
  </div>
