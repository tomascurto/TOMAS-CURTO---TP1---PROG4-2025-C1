<p-menubar>
    <ng-template pTemplate="start">
        <img src="assets/logo.png" alt="logo" height="40" />
        <p-menubar [model]="leftItems"></p-menubar>
     </ng-template>
    
    <ng-template pTemplate="end">
        <p-menubar [model]="rightItems"></p-menubar>
    </ng-template>
</p-menubar>
